<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order — LUMI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">

  <a class="logo" href="index.html">
    LUMI<span>.</span>
  </a>

  <nav>
    <a href="index.html">หน้าแรก</a>
    <a href="product.html">สินค้า</a>
    <a class="active" href="order.html">สั่งซื้อ</a>

    <a href="cart.html">
      ตะกร้า
      <span class="cart-count">0</span>
    </a>

    <a href="pos.html">POS</a>
  </nav>

</header>


<main class="order-page">

  <section class="page-head compact">

    <p class="eyebrow">ORDER FORM</p>

    <h1>สั่งซื้อ LUMI</h1>

    <p>
      ตรวจสอบสินค้าในตะกร้า แล้วกรอกข้อมูลสำหรับจัดส่ง
    </p>

  </section>


  <div class="order-layout">


    <!-- =========================
         FORM
    ========================== -->

    <form id="orderForm" class="form-card">

      <label>
        ชื่อ-นามสกุล
        <input
          required
          name="name"
          placeholder="ชื่อของคุณ"
        >
      </label>


      <label>
        เบอร์โทรศัพท์
        <input
          required
          name="phone"
          type="tel"
          placeholder="08x-xxx-xxxx"
        >
      </label>


      <label>
        ที่อยู่จัดส่ง

        <textarea
          required
          name="address"
          rows="4"
          placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์"
        ></textarea>

      </label>


      <!-- สินค้าจากตะกร้าจะมาแสดงตรงนี้ -->

      <div>

        <label>
          สินค้าในตะกร้า
        </label>

        <div
          id="cartItems"
          style="
            border:1px solid #ddd;
            border-radius:12px;
            padding:15px;
            margin-top:8px;
          "
        >
          กำลังโหลดสินค้า...
        </div>

      </div>


      <label>
        หมายเหตุ

        <textarea
          name="note"
          rows="3"
          placeholder="เช่น ฝากไว้หน้าบ้าน"
        ></textarea>

      </label>


      <button
        class="btn dark full"
        type="submit"
      >
        ยืนยันคำสั่งซื้อ →
      </button>


      <p class="form-note">
        * ระบบจะส่งรายละเอียดคำสั่งซื้อไปยังร้านค้า
      </p>

    </form>


    <!-- =========================
         SUMMARY
    ========================== -->

    <aside class="order-summary">

      <p class="eyebrow">
        YOUR ORDER
      </p>

      <div id="summary">
        กำลังโหลด...
      </div>

    </aside>

  </div>

</main>


<footer>

  <span>
    © 2026 LUMI.
  </span>

  <span>
    Scent your moment.
  </span>

</footer>


<script src="script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

  /* =========================
     GET CART
  ========================== */

  const cart =
    JSON.parse(
      localStorage.getItem("lumi_cart") || "[]"
    );


  const cartItems =
    document.getElementById("cartItems");

  const summary =
    document.getElementById("summary");


  /* =========================
     CART COUNT
  ========================== */

  const totalItems =
    cart.reduce(
      (total, item) =>
        total + Number(item.quantity || 0),
      0
    );


  document
    .querySelectorAll(".cart-count")
    .forEach(el => {
      el.textContent = totalItems;
    });


  /* =========================
     EMPTY CART
  ========================== */

  if (!cart.length) {

    cartItems.innerHTML = `
      <p>
        ยังไม่มีสินค้าในตะกร้า
      </p>

      <a href="product.html">
        ← ไปเลือกสินค้า
      </a>
    `;

    summary.innerHTML = `
      <p>
        ยังไม่มีสินค้า
      </p>
    `;

    return;
  }


  /* =========================
     SHOW CART ITEMS
  ========================== */

  cartItems.innerHTML = cart.map(item => {

    const quantity =
      Number(item.quantity || 1);

    const price =
      Number(item.price || 0);

    const total =
      price * quantity;

    return `

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          padding:10px 0;
          border-bottom:1px solid #eee;
        "
      >

        <div>

          <strong>
            ${item.name}
          </strong>

          <div>
            ${quantity} ชิ้น
          </div>

        </div>

        <strong>
          ${total.toLocaleString("th-TH")} บาท
        </strong>

      </div>

    `;

  }).join("");


  /* =========================
     ORDER SUMMARY
  ========================== */

  const grandTotal =
    cart.reduce(
      (total, item) =>
        total +
        Number(item.price || 0) *
        Number(item.quantity || 1),
      0
    );


  summary.innerHTML = `

    ${cart.map(item => `

      <div
        style="
          display:flex;
          justify-content:space-between;
          padding:8px 0;
        "
      >

        <span>
          ${item.name} × ${item.quantity}
        </span>

        <strong>
          ${(
            Number(item.price || 0) *
            Number(item.quantity || 1)
          ).toLocaleString("th-TH")} ฿
        </strong>

      </div>

    `).join("")}


    <hr>

    <div
      style="
        display:flex;
        justify-content:space-between;
        font-size:18px;
        margin-top:12px;
      "
    >

      <strong>
        รวมทั้งหมด
      </strong>

      <strong>
        ${grandTotal.toLocaleString("th-TH")} ฿
      </strong>

    </div>

  `;


  /* =========================
     SUBMIT ORDER
  ========================== */

  document
    .getElementById("orderForm")
    .addEventListener(
      "submit",
      async function (e) {

        e.preventDefault();


        const form =
          e.target;

        const formData =
          new FormData(form);


        const name =
          formData.get("name");

        const phone =
          formData.get("phone");

        const address =
          formData.get("address");

        const note =
          formData.get("note");


        /* =========================
           PRODUCT MESSAGE
        ========================== */

        const productMessage =
          cart.map(item => {

            const total =
              Number(item.price || 0) *
              Number(item.quantity || 1);

            return `
📦 ${item.name}
จำนวน: ${item.quantity}
ราคา: ${total.toLocaleString("th-TH")} บาท
`;

          }).join("\n");


        /* =========================
           TELEGRAM MESSAGE
        ========================== */

        const message = `

🕯️ มีคำสั่งซื้อใหม่จาก LUMI

👤 ชื่อลูกค้า:
${name}

📞 เบอร์โทร:
${phone}

📦 สินค้า:
${productMessage}

💰 รวมทั้งหมด:
${grandTotal.toLocaleString("th-TH")} บาท

📍 ที่อยู่จัดส่ง:
${address}

📝 หมายเหตุ:
${note || "-"}

        `;


        try {

          const response =
            await fetch(
              "/api/telegram",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    message:
                      message
                  })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.ok
          ) {

            throw new Error(
              data.error ||
              "ส่ง Telegram ไม่สำเร็จ"
            );

          }


          /* =========================
             CLEAR CART
          ========================== */

          localStorage.removeItem(
            "lumi_cart"
          );


          alert(
            "สั่งซื้อสำเร็จ! ทางร้านได้รับคำสั่งซื้อแล้ว 🕯️"
          );


          window.location.href =
            "thankyou.html";


        } catch (error) {

          console.error(error);

          alert(
            "ส่งคำสั่งซื้อไม่สำเร็จ กรุณาลองใหม่"
          );

        }

      }
    );

});

</script>

</body>
</html>
