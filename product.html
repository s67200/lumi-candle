<head>

  <!-- =========================
       PRODUCTS
  ========================== -->

  <main class="products-page">

    <section class="page-head">

      <p class="eyebrow">
        THE COLLECTION
      </p>

      <h1>
        เลือกกลิ่นที่ใช่
      </h1>

      <p>
        ค้นหากลิ่นเทียนหอมที่เหมาะกับอารมณ์และช่วงเวลาของคุณ
      </p>

    </section>


    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="ค้นหากลิ่นที่ต้องการ..."
      >

    </div>


    <!-- =========================
         FILTERS
    ========================== -->

    <div class="filters">

      <button
        class="filter active"
        data-filter="all">
        ทั้งหมด
      </button>

      <button
        class="filter"
        data-filter="Citrus Day">
        Citrus Day
      </button>

      <button
        class="filter"
        data-filter="Vanilla Cloud">
        Vanilla Cloud
      </button>

      <button
        class="filter"
        data-filter="Rose Bloom">
        Rose Bloom
      </button>

      <button
        class="filter"
        data-filter="Lavender Calm">
        Lavender Calm
      </button>

      <button
        class="filter"
        data-filter="Ocean Breeze">
        Ocean Breeze
      </button>

      <button
        class="filter"
        data-filter="Forest Dream">
        Forest Dream
      </button>

      <button
        class="filter"
        data-filter="Coffee Focus">
        Coffee Focus
      </button>

      <button
        class="filter"
        data-filter="Peach Glow">
        Peach Glow
      </button>

      <button
        class="filter"
        data-filter="Berry Kiss">
        Berry Kiss
      </button>

      <button
        class="filter"
        data-filter="Fresh Linen">
        Fresh Linen
      </button>

      <button
        class="filter"
        data-filter="Sweet Apple">
        Sweet Apple
      </button>

    </div>


    <!-- =========================
         PRODUCT GRID
    ========================== -->

    <section
      id="productGrid"
      class="product-grid">

      <!-- สินค้าจะถูกสร้างโดย script.js -->

    </section>

  <footer>

    <span>

    <span>
